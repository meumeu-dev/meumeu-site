<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unattend — autounattend.xml generator</title>
    <meta name="description" content="Générateur d'autounattend.xml pour Windows 10/11. FR / EN / DE / ES. 100% client-side.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a12;
            --card: #12141e;
            --line: #1e2233;
            --txt: #e4e5ea;
            --dim: #6b6f80;
            --accent: #6c5ce7;
            --accent2: #5cc8ff;
        }

        body {
            background: var(--bg);
            color: var(--txt);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { color: #7c6df7; }

        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(108,108,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108,108,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .wrap { position: relative; z-index: 2; max-width: 1180px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

        /* Header */
        header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
        .brand { display: flex; align-items: baseline; gap: 0.6rem; }
        .brand h1 {
            font-size: 1.6rem; font-weight: 800; letter-spacing: -1px;
            background: linear-gradient(135deg, #6c6cff 0%, #5cc8ff 50%, #4aff6a 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .brand .tag { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); }
        .back { font-size: 0.75rem; color: var(--dim); }
        .back:hover { color: var(--txt); }

        .langbar { display: flex; gap: 0.25rem; }
        .langbar button {
            font: inherit; font-size: 0.68rem; letter-spacing: 0.5px;
            padding: 0.35rem 0.55rem; border-radius: 5px; cursor: pointer;
            background: transparent; color: var(--dim);
            border: 1px solid var(--line);
        }
        .langbar button:hover { color: var(--txt); border-color: #2c3145; }
        .langbar button[aria-pressed="true"] { color: var(--txt); background: #191c2b; border-color: #3a3f5a; }

        .intro { font-size: 0.82rem; line-height: 1.55; color: var(--dim); max-width: 70ch; margin-bottom: 1.6rem; }
        .intro strong { color: #b9bcc9; font-weight: 600; }

        /* Layout */
        .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
        @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 1rem 1.1rem;
            margin-bottom: 0.9rem;
        }

        .card h2 {
            font-size: 0.62rem; text-transform: uppercase; letter-spacing: 2.5px;
            color: #4a4f63; font-weight: 600; margin-bottom: 0.85rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .card h2 .num {
            width: 17px; height: 17px; border-radius: 50%;
            background: rgba(108,92,231,0.12); color: #8a7df0;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.6rem; letter-spacing: 0;
        }

        .field { margin-bottom: 0.75rem; }
        .field:last-child { margin-bottom: 0; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; }
        @media (max-width: 520px) { .row2, .row3 { grid-template-columns: 1fr; } }

        label { display: block; font-size: 0.7rem; color: #8b90a3; margin-bottom: 0.3rem; }
        label .hint { color: #4a4f63; font-size: 0.62rem; margin-left: 0.3rem; }

        input[type="text"], input[type="password"], input[type="number"], select {
            width: 100%; font: inherit; font-size: 0.8rem;
            padding: 0.5rem 0.6rem;
            background: #0d0f18; color: var(--txt);
            border: 1px solid var(--line); border-radius: 6px;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }
        input::placeholder { color: #3d4154; }
        select { appearance: none; padding-right: 1.8rem;
            background-image:
                linear-gradient(45deg, transparent 50%, #6b6f80 50%),
                linear-gradient(135deg, #6b6f80 50%, transparent 50%);
            background-position: calc(100% - 14px) calc(50% + 1px), calc(100% - 9px) calc(50% + 1px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }

        .checks { display: flex; flex-direction: column; gap: 0.55rem; }
        .check { display: flex; gap: 0.55rem; align-items: flex-start; cursor: pointer; }
        .check input { margin-top: 0.15rem; accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; }
        .check .cl { font-size: 0.78rem; line-height: 1.35; }
        .check .cl small { display: block; font-size: 0.66rem; color: #4a4f63; margin-top: 0.1rem; }

        /* Preview */
        .side { position: sticky; top: 1.25rem; }
        @media (max-width: 900px) { .side { position: static; } }

        .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.6rem; }
        .preview-head h2 { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 2.5px; color: #4a4f63; font-weight: 600; }
        .badge { font-size: 0.6rem; color: #4aff6a; background: rgba(74,255,106,0.07); border: 1px solid rgba(74,255,106,0.18); padding: 0.15rem 0.4rem; border-radius: 4px; }

        pre#out {
            background: #0d0f18; border: 1px solid var(--line); border-radius: 10px;
            padding: 0.9rem; font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
            font-size: 0.66rem; line-height: 1.5; color: #a9adbb;
            overflow: auto; max-height: 62vh; white-space: pre;
            tab-size: 2;
        }
        pre#out .t { color: #8a7df0; }
        pre#out .a { color: #5cc8ff; }
        pre#out .v { color: #8fbf7a; }
        pre#out .c { color: #454a5e; font-style: italic; }

        .actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; flex-wrap: wrap; }
        .btn {
            font: inherit; font-size: 0.78rem; font-weight: 600;
            padding: 0.55rem 0.9rem; border-radius: 7px; cursor: pointer;
            border: 1px solid var(--line); background: #161927; color: var(--txt);
            transition: border-color .15s, background .15s;
        }
        .btn:hover { border-color: #3a3f5a; }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { background: #7c6df7; border-color: #7c6df7; }
        .btn[disabled] { opacity: 0.5; cursor: default; }

        .note {
            margin-top: 0.8rem; font-size: 0.7rem; line-height: 1.5; color: #5b6074;
            border-left: 2px solid #2a2f44; padding-left: 0.7rem;
        }
        .note strong { color: #8b90a3; font-weight: 600; }
        .note code { font-family: ui-monospace, monospace; color: #8a7df0; font-size: 0.95em; }

        .warn { display: none; margin-top: 0.6rem; font-size: 0.72rem; color: #f0b866; background: rgba(240,184,102,0.06); border: 1px solid rgba(240,184,102,0.2); border-radius: 6px; padding: 0.5rem 0.6rem; line-height: 1.45; }
        .warn.show { display: block; }

        footer { margin-top: 2.5rem; font-size: 0.68rem; color: #3d4154; text-align: center; line-height: 1.6; }
        footer a { color: #4a4f63; }
        footer a:hover { color: var(--txt); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="wrap">
        <header>
            <div>
                <div class="brand">
                    <h1>unattend</h1>
                    <span class="tag">autounattend.xml</span>
                </div>
            </div>
            <div class="langbar" id="langbar" role="group" aria-label="Language">
                <button type="button" data-lang="fr" aria-pressed="true">FR</button>
                <button type="button" data-lang="en" aria-pressed="false">EN</button>
                <button type="button" data-lang="de" aria-pressed="false">DE</button>
                <button type="button" data-lang="es" aria-pressed="false">ES</button>
            </div>
        </header>

        <p class="intro" data-i18n-html="intro"></p>

        <div class="grid">
            <!-- ============ FORM ============ -->
            <div>
                <div class="card">
                    <h2><span class="num">1</span><span data-i18n="s1"></span></h2>
                    <div class="row2">
                        <div class="field">
                            <label for="winver" data-i18n="winver"></label>
                            <select id="winver">
                                <option value="11">Windows 11</option>
                                <option value="10">Windows 10</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="arch" data-i18n="arch"></label>
                            <select id="arch">
                                <option value="amd64">x64 (amd64)</option>
                                <option value="arm64">ARM64</option>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label for="edition" data-i18n="edition"></label>
                        <input type="text" id="edition" list="editionList" spellcheck="false" autocomplete="off">
                        <datalist id="editionList"></datalist>
                    </div>
                    <div class="field">
                        <label for="productkey"><span data-i18n="productkey"></span><span class="hint" data-i18n="optional"></span></label>
                        <input type="text" id="productkey" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" spellcheck="false" autocomplete="off">
                    </div>
                </div>

                <div class="card">
                    <h2><span class="num">2</span><span data-i18n="s2"></span></h2>
                    <div class="field">
                        <label for="locale" data-i18n="locale"></label>
                        <select id="locale"></select>
                    </div>
                    <div class="field">
                        <label for="tz" data-i18n="tz"></label>
                        <select id="tz"></select>
                    </div>
                </div>

                <div class="card">
                    <h2><span class="num">3</span><span data-i18n="s3"></span></h2>
                    <div class="row2">
                        <div class="field">
                            <label for="diskpart" data-i18n="diskpart"></label>
                            <select id="diskpart">
                                <option value="uefi" data-i18n="disk_uefi"></option>
                                <option value="mbr" data-i18n="disk_mbr"></option>
                                <option value="none" data-i18n="disk_none"></option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="diskn" data-i18n="diskn"></label>
                            <input type="number" id="diskn" value="0" min="0" max="9">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2><span class="num">4</span><span data-i18n="s4"></span></h2>
                    <div class="row2">
                        <div class="field">
                            <label for="computername" data-i18n="computername"></label>
                            <input type="text" id="computername" maxlength="15" spellcheck="false" autocomplete="off">
                        </div>
                        <div class="field">
                            <label for="username" data-i18n="username"></label>
                            <input type="text" id="username" value="User" spellcheck="false" autocomplete="off">
                        </div>
                    </div>
                    <div class="field">
                        <label for="password"><span data-i18n="password"></span><span class="hint" data-i18n="optional"></span></label>
                        <input type="text" id="password" spellcheck="false" autocomplete="off">
                    </div>
                    <div class="checks">
                        <label class="check">
                            <input type="checkbox" id="autologon" checked>
                            <span class="cl"><span data-i18n="autologon"></span><small data-i18n="autologon_h"></small></span>
                        </label>
                    </div>
                </div>

                <div class="card">
                    <h2><span class="num">5</span><span data-i18n="s5"></span></h2>
                    <div class="checks">
                        <label class="check">
                            <input type="checkbox" id="skipoobe" checked>
                            <span class="cl"><span data-i18n="skipoobe"></span><small data-i18n="skipoobe_h"></small></span>
                        </label>
                        <label class="check">
                            <input type="checkbox" id="bypass">
                            <span class="cl"><span data-i18n="bypass"></span><small data-i18n="bypass_h"></small></span>
                        </label>
                        <label class="check">
                            <input type="checkbox" id="debloat">
                            <span class="cl"><span data-i18n="debloat"></span><small data-i18n="debloat_h"></small></span>
                        </label>
                        <label class="check">
                            <input type="checkbox" id="privacy">
                            <span class="cl"><span data-i18n="privacy"></span><small data-i18n="privacy_h"></small></span>
                        </label>
                        <label class="check">
                            <input type="checkbox" id="rdp">
                            <span class="cl"><span data-i18n="rdp"></span><small data-i18n="rdp_h"></small></span>
                        </label>
                    </div>
                </div>

                <div class="warn" id="warn"></div>
            </div>

            <!-- ============ PREVIEW ============ -->
            <div class="side">
                <div class="preview-head">
                    <h2 data-i18n="preview"></h2>
                    <span class="badge" data-i18n="clientside"></span>
                </div>
                <pre id="out" aria-live="polite"></pre>
                <div class="actions">
                    <button type="button" class="btn primary" id="dl" data-i18n="download"></button>
                    <button type="button" class="btn" id="copy" data-i18n="copy"></button>
                    <button type="button" class="btn" id="reset" data-i18n="reset"></button>
                </div>
                <div class="note" data-i18n-html="note"></div>
            </div>
        </div>

        <footer>
            <span data-i18n="footer"></span><br>
            <a href="/">meumeu.dev</a> · <a href="https://schneegans.de/windows/unattend-generator/" rel="noopener">schneegans.de</a>
        </footer>
    </div>

    <script src="/unattend/app.js"></script>
</body>
</html>
